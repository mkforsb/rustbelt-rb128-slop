[workspace]
resolver = "2"
members = ["crates/engine", "crates/engine-wasm", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# DSP must be fast even in debug builds of the UI
[profile.dev.package.rustbelt-engine]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
