[package]
name = "rustbelt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RUSTBELT RB-128: a techno session groovebox (Dioxus, web + desktop)"
build = "build.rs"

[dependencies]
dioxus = { version = "0.7.10" }
rustbelt-engine = { path = "../engine" }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libpulse-binding = { version = "2.30", optional = true }
libpulse-simple-binding = { version = "2.29", optional = true }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "dep:libpulse-binding", "dep:libpulse-simple-binding"]
